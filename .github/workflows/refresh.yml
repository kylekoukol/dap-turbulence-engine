name: Refresh turbulence data

# Hourly, a few minutes after the top of the hour to let NCEP finish posting a
# cycle. Also runnable on demand (used to seed the first cycle during the build).
on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:

concurrency:
  group: turbulence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # NOTE: do NOT apt-install eccodes here. The pygrib wheel bundles its own
      # eccodes; a second system copy conflicts and crashes the decoder on the
      # first real GRIB file. The wheel is self-contained.
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import pygrib; print('pygrib', pygrib.__version__, 'ready')"

      - name: Run turbulence pipeline
        env:
          # Public app ingest route (not secret). Override via repo variable
          # INGEST_URL if you move to a custom domain later.
          INGEST_URL: ${{ vars.INGEST_URL || 'https://dialapilot.com/api/ingest' }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python run.py
