name: Collect airport conditions

# Hourly snapshot of surface weather + nearby low-altitude pilot reports for the
# target airports, appended to the airport_obs history. This is the compounding
# data behind the "best times to fly into <airport>" tool: every run adds an
# hour of observations tagged with the airport's local time. Also self-runs on a
# push to its own files (used to seed the first observation).
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collect_airport_obs.py"
      - ".github/workflows/airport-obs.yml"

concurrency:
  group: airport-obs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests tzdata

      - name: Collect and ingest
        env:
          APP_URL: ${{ vars.APP_URL || 'https://dap-turbulence.lovable.app' }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python collect_airport_obs.py
